<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>PokéTrack – Deine Pokémon-Sammlung</title>
    <meta name="description" content="Deine PokéTrack-Sammlung im Browser: Karten erfassen, Werte verfolgen, auf allen Geräten dieselbe Sammlung." />
    <!--
      noindex: Hinter der Anmeldung liegt nichts, was eine Suchmaschine zeigen
      koennte - sie saehe nur die Anmeldemaske. Ausserdem soll das Crawl-Budget
      bei den 19.000 Katalogseiten bleiben, nicht bei einem 3-MB-Bundle.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0F1F33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PokéTrack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Tiefe Adressen wieder herstellen.

      Die Web-App hat seit navigation/verknuepfung.web.ts eigene Adressen
      (/app/karte/xy-1), damit die Zurueck-Taste des Browsers funktioniert.
      Innerhalb einer Sitzung genuegt dafuer die History-API - beim NEULADEN
      fragt der Browser die Adresse aber beim Server an, und dort liegt keine
      Datei: Der Export ist eine einzige index.html.

      GitHub Pages beantwortet so etwas mit der 404.html im Wurzelverzeichnis.
      Die schickt Adressen unter /app/ hierher zurueck und haengt den
      urspruenglichen Pfad als ?p= an; hier wird er wieder in die Adresszeile
      geschrieben, bevor das Bundle laeuft und sie ausliest. Der lokale
      Vorschauserver macht dasselbe, damit beide Wege gleich sind.
    -->
    <script>
      (function () {
        var treffer = /[?&]p=([^&]*)/.exec(window.location.search);
        if (!treffer) return;
        var pfad = decodeURIComponent(treffer[1]);
        if (pfad.charAt(0) !== '/') pfad = '/' + pfad;
        var rest = window.location.search.replace(/[?&]p=[^&]*/, '');
        if (rest === '?' || rest === '') rest = '';
        else if (rest.charAt(0) === '&') rest = '?' + rest.slice(1);
        window.history.replaceState(null, '', '/app' + pfad + rest + window.location.hash);
      })();
    </script>

    <!-- Die von react-native-web empfohlene Grundeinstellung. -->
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #0F1F33; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>

    <!--
      Ladeschirm.

      Das JavaScript-Bundle ist einige Megabyte gross; bis es ausgefuehrt wird,
      stuende hier sonst eine leere dunkle Flaeche - auf einer langsamen
      Verbindung mehrere Sekunden lang, ununterscheidbar von einer kaputten
      Seite. Deshalb dasselbe Bild, das die App beim Start zeigt, schon im HTML:
      Es ist da, bevor eine einzige Zeile JavaScript laeuft.
    -->
    <style>
      #ladeschirm {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0F1F33;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        z-index: 10;
        transition: opacity .25s ease;
      }
      #ladeschirm.fort { opacity: 0; pointer-events: none; }
      #ladeschirm .marke {
        font-size: 44px;
        font-weight: 900;
        color: #F0B429;
        letter-spacing: 1px;
      }
      #ladeschirm .unterzeile {
        font-size: 14px;
        color: rgba(255,255,255,.4);
        margin-top: 4px;
        margin-bottom: 40px;
      }
      #ladeschirm .kreisel {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid rgba(240,180,41,.2);
        border-top-color: #F0B429;
        animation: dreh 1s linear infinite;
      }
      #ladeschirm .fuss {
        font-size: 12px;
        color: rgba(255,255,255,.25);
        margin-top: 16px;
      }
      @keyframes dreh { to { transform: rotate(360deg); } }
      /* Wer Bewegung reduziert haben moechte, bekommt keinen drehenden Kreis. */
      @media (prefers-reduced-motion: reduce) {
        #ladeschirm .kreisel { animation: none; }
      }
    </style>
  <link rel="icon" href="/app/favicon.ico" /></head>

  <body>
    <noscript>
      PokéTrack braucht JavaScript. Bitte aktiviere es – oder benutze die App
      für iPhone.
    </noscript>

    <div id="ladeschirm">
      <div class="marke">PokéTrack</div>
      <div class="unterzeile">Deine Pokémon-Sammlung</div>
      <div class="kreisel"></div>
      <div class="fuss">Wird geladen…</div>
    </div>

    <div id="root"></div>

    <script>
      // Den Ladeschirm ausblenden, sobald React etwas in #root gezeichnet hat.
      // Ein fester Zeitgeber waere geraten: Auf einem schnellen Rechner zu
      // lang, auf einem langsamen zu kurz.
      (function () {
        var wurzel = document.getElementById('root');
        var schirm = document.getElementById('ladeschirm');
        if (!wurzel || !schirm) return;

        function weg() {
          schirm.classList.add('fort');
          setTimeout(function () {
            if (schirm.parentNode) schirm.parentNode.removeChild(schirm);
          }, 300);
        }

        if (wurzel.childElementCount > 0) return weg();

        var beobachter = new MutationObserver(function () {
          if (wurzel.childElementCount > 0) {
            beobachter.disconnect();
            weg();
          }
        });
        beobachter.observe(wurzel, { childList: true });

        // Notausgang: Bricht das Bundle ab, soll der Nutzer nicht ewig auf
        // einen drehenden Kreis sehen, sondern erfahren, was los ist.
        setTimeout(function () {
          if (wurzel.childElementCount > 0) return;
          beobachter.disconnect();
          var fuss = schirm.querySelector('.fuss');
          if (fuss) {
            fuss.textContent = 'Das dauert ungewöhnlich lange. Seite neu laden?';
            fuss.style.color = 'rgba(255,255,255,.6)';
          }
          var kreisel = schirm.querySelector('.kreisel');
          if (kreisel) kreisel.style.display = 'none';
        }, 30000);
      })();
    </script>
  <script src="/app/_expo/static/js/web/index-5b35018152c27e47f6dcf6126710ee3c.js" defer></script>
</body>
</html>
